<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPE Interfaces de Usuario</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #0C122A;
        --naranja: #B8461D;
        --dorado: #C9A227;
        --marfil: #F4E3DD;
        --texto: #DCDEE5;
        --muted: #8B8B95;
        --tenue: #66666E;
    }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
        background-color: var(--bg);
        background-image:
            radial-gradient(600px 300px at 82% -10%, rgba(184, 70, 29, .25), transparent 60%),
            radial-gradient(700px 420px at 8% 110%, rgba(26, 33, 64, .95), transparent 62%);
        color: var(--texto);
        overflow-x: hidden;
    }
    .square {
        position: fixed;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        opacity: .35;
        animation: flotar 7s ease-in-out infinite;
    }
    .square.blue   { background: #3A4A8A; top: 12%; left: 8%; animation-delay: 0s; }
    .square.orange { background: var(--naranja); bottom: 14%; right: 10%; animation-delay: 1.5s; }
    .square.light  { background: var(--marfil); top: 22%; right: 16%; width: 8px; height: 8px; animation-delay: 3s; }
    @keyframes flotar {
        0%, 100% { transform: translateY(0) rotate(0); }
        50%      { transform: translateY(-14px) rotate(45deg); }
    }
    .marco {
        width: 100%;
        max-width: 460px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 48px 20px;
        text-align: center;
    }
    .eyebrow {
        font-size: 12px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--dorado);
        animation: subir .7s ease both;
    }
    h1 {
        font-size: 30px;
        font-weight: 700;
        color: #FFF;
        letter-spacing: .5px;
        animation: subir .7s .08s ease both;
    }
    h1 .destacar { color: var(--dorado); }
    .regla {
        width: 64px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--dorado), transparent);
        animation: subir .7s .16s ease both;
    }
    .entregas {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
        margin-top: 14px;
    }
    .entrega {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 26px 22px 20px;
        border: 1px solid rgba(244, 227, 221, .35);
        border-radius: 10px;
        background-color: rgba(26, 33, 64, .9);
        background-image: radial-gradient(200px 90px at 85% 0%, rgba(201, 162, 39, .14), transparent 70%);
        text-decoration: none;
        color: inherit;
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        animation: subir .7s ease both;
    }
    .entrega:first-child { animation-delay: .24s; }
    .entrega:last-child  { animation-delay: .34s; }
    .entrega:hover {
        transform: translateY(-4px);
        border-color: var(--dorado);
        box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    }
    .numero {
        position: absolute;
        top: -16px;
        right: 8px;
        font-size: 58px;
        font-weight: 800;
        line-height: 1;
        color: rgba(220, 222, 229, .06);
        pointer-events: none;
        user-select: none;
    }
    .icono {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background-color: var(--naranja);
        color: #FFF;
        box-shadow: 0 4px 12px rgba(184, 70, 29, .4);
        margin-bottom: 8px;
    }
    .icono svg { width: 22px; height: 22px; }
    .entrega h2 { font-size: 17px; font-weight: 700; color: var(--marfil); }
    .entrega p  { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .abrir {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--dorado);
        transition: gap .2s ease;
    }
    .abrir svg { width: 14px; height: 14px; }
    .entrega:hover .abrir { gap: 12px; }
    footer {
        width: 100%;
        padding: 18px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--tenue);
        border-top: 1px solid rgba(244, 227, 221, .12);
    }
    @keyframes subir {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
    }
</style>
</head>
<body>
    <span class="square blue"></span>
    <span class="square orange"></span>
    <span class="square light"></span>

    <div class="marco">
        <p class="eyebrow">Trabajo Practico</p>
        <h1>Interfaces de <span class="destacar">Usuario</span></h1>
        <div class="regla"></div>

        <div class="entregas">
            <a class="entrega" href="TPE-Interfaces/PrimeraEntrega/index.html">
                <span class="numero">01</span>
                <span class="icono">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6h14M4 12h10M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M18 10l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <h2>Primera Entrega</h2>
                <p>Prototipo y wireframes</p>
                <span class="abrir">Abrir entrega
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>

            <a class="entrega" href="TPE-Interfaces/SegundaEntrega/login.html">
                <span class="numero">02</span>
                <span class="icono">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 9h18M9 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <h2>Segunda Entrega</h2>
                <p>Pagina web FastGames</p>
                <span class="abrir">Abrir entrega
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
        </div>
    </div>

    <footer>Lopez Lautaro &middot; Wilson Benito Ezequiel</footer>
</body>
</html>
