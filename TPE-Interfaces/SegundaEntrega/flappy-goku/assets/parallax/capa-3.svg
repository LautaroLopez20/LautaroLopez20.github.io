<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 18" width="120" height="18" shape-rendering="crispEdges">
  <!-- Capa cercana: los pilares ya toman el verde de la vegetacion. Grilla de
       10px: cuerpo + remate escalonado. Los cuerpos bajan hasta y+h=20 (el
       viewBox termina en 18) para que apoyen rectos. -->
  <g fill="#4C7F6E">
    <rect x="6" y="2" width="5" height="2" rx="1"/>
    <rect x="5" y="4" width="7" height="16" rx="1"/>
    <rect x="16" y="6" width="3" height="2" rx="1"/>
    <rect x="15" y="8" width="5" height="12" rx="1"/>
    <rect x="25" y="0" width="6" height="2" rx="1"/>
    <rect x="24" y="2" width="8" height="18" rx="1"/>
    <rect x="37" y="5" width="4" height="2" rx="1"/>
    <rect x="36" y="7" width="6" height="13" rx="1"/>
    <rect x="46" y="8" width="3" height="2" rx="1"/>
    <rect x="45" y="10" width="5" height="10" rx="1"/>
    <rect x="54" y="2" width="5" height="2" rx="1"/>
    <rect x="53" y="4" width="7" height="16" rx="1"/>
    <rect x="65" y="6" width="3" height="2" rx="1"/>
    <rect x="64" y="8" width="5" height="12" rx="1"/>
    <rect x="74" y="1" width="5" height="2" rx="1"/>
    <rect x="73" y="3" width="7" height="17" rx="1"/>
    <rect x="85" y="4" width="3" height="2" rx="1"/>
    <rect x="84" y="6" width="5" height="14" rx="1"/>
    <rect x="93" y="0" width="5" height="2" rx="1"/>
    <rect x="92" y="2" width="7" height="18" rx="1"/>
    <rect x="105" y="3" width="4" height="2" rx="1"/>
    <rect x="104" y="5" width="6" height="15" rx="1"/>
    <rect x="113" y="7" width="3" height="2" rx="1"/>
    <rect x="112" y="9" width="5" height="11" rx="1"/>
  </g>
  <!-- Neblina en cuatro bandas duras, mas tenue que en las capas de atras. -->
  <g fill="#FFFFFF">
    <rect y="10" width="120" height="2" fill-opacity="0.11"/>
    <rect y="12" width="120" height="2" fill-opacity="0.21"/>
    <rect y="14" width="120" height="2" fill-opacity="0.32"/>
    <rect y="16" width="120" height="2" fill-opacity="0.42"/>
  </g>
</svg>
