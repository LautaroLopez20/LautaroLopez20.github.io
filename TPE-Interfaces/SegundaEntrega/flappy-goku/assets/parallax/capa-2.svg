<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 24" width="120" height="24" shape-rendering="crispEdges">
  <!-- Capa media: pilares mas definidos, todavia azulados por la distancia.
       Grilla de 10px, igual que la capa 1: cuerpo + remate escalonado.
       Los cuerpos bajan hasta y+h=26 (el viewBox termina en 24) para que el
       redondeo inferior quede fuera y apoyen rectos. -->
  <g fill="#77A3B4">
    <rect x="7" y="5" width="4" height="2" rx="1"/>
    <rect x="6" y="7" width="6" height="19" rx="1"/>
    <rect x="17" y="9" width="2" height="2" rx="1"/>
    <rect x="16" y="11" width="4" height="15" rx="1"/>
    <rect x="26" y="1" width="5" height="2" rx="1"/>
    <rect x="25" y="3" width="7" height="23" rx="1"/>
    <rect x="38" y="7" width="3" height="2" rx="1"/>
    <rect x="37" y="9" width="5" height="17" rx="1"/>
    <rect x="47" y="12" width="2" height="2" rx="1"/>
    <rect x="46" y="14" width="4" height="12" rx="1"/>
    <rect x="55" y="4" width="4" height="2" rx="1"/>
    <rect x="54" y="6" width="6" height="20" rx="1"/>
    <rect x="66" y="10" width="3" height="2" rx="1"/>
    <rect x="65" y="12" width="5" height="14" rx="1"/>
    <rect x="74" y="2" width="4" height="2" rx="1"/>
    <rect x="73" y="4" width="6" height="22" rx="1"/>
    <rect x="84" y="9" width="2" height="2" rx="1"/>
    <rect x="83" y="11" width="4" height="15" rx="1"/>
    <rect x="92" y="6" width="5" height="2" rx="1"/>
    <rect x="91" y="8" width="7" height="18" rx="1"/>
    <rect x="103" y="1" width="3" height="2" rx="1"/>
    <rect x="102" y="3" width="5" height="23" rx="1"/>
    <rect x="111" y="8" width="4" height="2" rx="1"/>
    <rect x="110" y="10" width="6" height="16" rx="1"/>
  </g>
  <!-- Neblina en cuatro bandas duras. -->
  <g fill="#FFFFFF">
    <rect y="12" width="120" height="3" fill-opacity="0.13"/>
    <rect y="15" width="120" height="3" fill-opacity="0.25"/>
    <rect y="18" width="120" height="3" fill-opacity="0.38"/>
    <rect y="21" width="120" height="3" fill-opacity="0.5"/>
  </g>
</svg>
