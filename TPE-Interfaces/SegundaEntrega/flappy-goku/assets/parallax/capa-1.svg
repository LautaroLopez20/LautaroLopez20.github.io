<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 30" width="120" height="30" shape-rendering="crispEdges">
  <!-- Capa mas lejana: pilares de arenisca de Zhangjiajie disueltos en bruma.
       Grilla de 10px: el SVG mide 120x30 y el CSS lo estira a 1200px, asi que
       cada unidad de aca es un bloque de 10px en pantalla.
       Cada pilar es dos rects: el cuerpo y un remate mas angosto de 2 bloques
       de alto. Ese escalon es lo que hace que se lea como pixel y no como un
       rectangulo vectorial.
       Los cuerpos bajan hasta y+h=32 (el viewBox termina en 30) a proposito: el
       redondeo de rx queda fuera del area visible y el pilar apoya recto. -->
  <g fill="#9DC0D4">
    <rect x="5" y="7" width="3" height="2" rx="1"/>
    <rect x="4" y="9" width="5" height="23" rx="1"/>
    <rect x="13" y="13" width="1" height="2" rx="1"/>
    <rect x="12" y="15" width="3" height="17" rx="1"/>
    <rect x="20" y="4" width="4" height="2" rx="1"/>
    <rect x="19" y="6" width="6" height="26" rx="1"/>
    <rect x="30" y="10" width="2" height="2" rx="1"/>
    <rect x="29" y="12" width="4" height="20" rx="1"/>
    <rect x="38" y="15" width="1" height="2" rx="1"/>
    <rect x="37" y="17" width="3" height="15" rx="1"/>
    <rect x="45" y="6" width="3" height="2" rx="1"/>
    <rect x="44" y="8" width="5" height="24" rx="1"/>
    <rect x="55" y="12" width="2" height="2" rx="1"/>
    <rect x="54" y="14" width="4" height="18" rx="1"/>
    <rect x="63" y="2" width="3" height="2" rx="1"/>
    <rect x="62" y="4" width="5" height="28" rx="1"/>
    <rect x="72" y="14" width="1" height="2" rx="1"/>
    <rect x="71" y="16" width="3" height="16" rx="1"/>
    <rect x="78" y="7" width="4" height="2" rx="1"/>
    <rect x="77" y="9" width="6" height="23" rx="1"/>
    <rect x="88" y="11" width="2" height="2" rx="1"/>
    <rect x="87" y="13" width="4" height="19" rx="1"/>
    <rect x="96" y="5" width="2" height="2" rx="1"/>
    <rect x="95" y="7" width="4" height="25" rx="1"/>
    <rect x="105" y="13" width="1" height="2" rx="1"/>
    <rect x="104" y="15" width="3" height="17" rx="1"/>
    <rect x="112" y="8" width="3" height="2" rx="1"/>
    <rect x="111" y="10" width="5" height="22" rx="1"/>
  </g>
  <!-- Neblina en cuatro bandas duras, no en degradé: la atmosfera tambien se
       dibuja en bloques. El ultimo tramo es el mas opaco, pegado al suelo. -->
  <g fill="#FFFFFF">
    <rect y="14" width="120" height="4" fill-opacity="0.14"/>
    <rect y="18" width="120" height="4" fill-opacity="0.28"/>
    <rect y="22" width="120" height="4" fill-opacity="0.42"/>
    <rect y="26" width="120" height="4" fill-opacity="0.55"/>
  </g>
</svg>
